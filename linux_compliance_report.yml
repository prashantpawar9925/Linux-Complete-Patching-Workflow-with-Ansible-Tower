---
- name: Generate Linux Patch Compliance Report
  hosts: Ubuntu-Server
  become: true
  gather_facts: true

  tasks:

    # ============================================================
    # 1. SERVER INFORMATION
    # ============================================================

    - name: Record compliance report start time
      ansible.builtin.set_fact:
        compliance_report_start: "{{ lookup('pipe', 'date +%H:%M:%S') }}"

    - name: Get server hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Get server IP address
      ansible.builtin.shell: |
        hostname -I | awk '{print $1}'
      register: ip_address
      changed_when: false

    - name: Get kernel version
      ansible.builtin.command: uname -r
      register: kernel_version
      changed_when: false

    - name: Get operating system
      ansible.builtin.command: lsb_release -ds
      register: ubuntu_version
      changed_when: false
      failed_when: false

    # ============================================================
    # 2. DISK VALIDATION
    # ============================================================

    - name: Check root filesystem
      ansible.builtin.command: df -h /
      register: disk_result
      changed_when: false

    - name: Check root filesystem free space in GB
      ansible.builtin.shell: |
        df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}'
      register: disk_free_gb
      changed_when: false

    - name: Set minimum required disk space
      ansible.builtin.set_fact:
        minimum_disk_gb: 1

    - name: Determine disk validation status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'PASS'
            if (disk_free_gb.stdout | trim | int) >= minimum_disk_gb
            else 'FAIL'
          }}

    # ============================================================
    # 3. CONNECTIVITY VALIDATION
    # ============================================================

    - name: Validate local connectivity
      ansible.builtin.command: ping -c 2 -W 2 8.8.8.8
      register: connectivity_check
      changed_when: false
      failed_when: false

    - name: Determine connectivity status
      ansible.builtin.set_fact:
        connectivity_status: >-
          {{
            'PASS'
            if connectivity_check.rc == 0
            else 'FAIL'
          }}

    # ============================================================
    # 4. SSH SERVICE VALIDATION
    # ============================================================

    - name: Check SSH service
      ansible.builtin.command: systemctl is-active ssh
      register: ssh_service
      changed_when: false
      failed_when: false

    - name: Determine SSH status
      ansible.builtin.set_fact:
        ssh_status: >-
          {{
            'PASS'
            if (ssh_service.stdout | trim) == 'active'
            else 'FAIL'
          }}

    # ============================================================
    # 5. REBOOT VALIDATION
    # ============================================================

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Determine reboot status
      ansible.builtin.set_fact:
        reboot_status: >-
          {{
            'PASS'
            if not reboot_required.stat.exists
            else 'FAIL'
          }}

    # ============================================================
    # 6. SERVER REACHABILITY
    # ============================================================

    - name: Validate Ansible connection
      ansible.builtin.command: echo "Server reachable"
      register: reachability_check
      changed_when: false
      failed_when: false

    - name: Determine server reachability
      ansible.builtin.set_fact:
        server_reachable: >-
          {{
            'PASS'
            if reachability_check.rc == 0
            else 'FAIL'
          }}

    # ============================================================
    # 7. PATCH ACTIVITY
    # ============================================================

    - name: Check whether patch activity file exists
      ansible.builtin.stat:
        path: /var/tmp/awx_patch_activity.txt
      register: patch_activity_file_stat

    - name: Read patch activity file
      ansible.builtin.slurp:
        src: /var/tmp/awx_patch_activity.txt
      register: patch_activity_raw
      when: patch_activity_file_stat.stat.exists

    - name: Set patch activity content
      ansible.builtin.set_fact:
        patch_activity_content: >-
          {{
            patch_activity_raw.content | b64decode
            if patch_activity_file_stat.stat.exists
            else ''
          }}

    - name: Count packages changed
      ansible.builtin.set_fact:
        packages_changed: >-
          {{
            patch_activity_content.splitlines()
            | reject('equalto', '')
            | list
            | length
          }}

    - name: Determine patch activity status
      ansible.builtin.set_fact:
        patch_activity_status: >-
          {{
            'PASS'
            if packages_changed | int > 0
            else 'PASS - NO PACKAGE CHANGES'
          }}

    - name: Display patch activity
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "PATCH ACTIVITY"
          - "=============================================="
          - "{{ patch_activity_content | default('No package changes detected.') }}"
          - "Total Packages Changed : {{ packages_changed }}"
          - "Patch Activity Status   : {{ patch_activity_status }}"

    # ============================================================
    # 8. PATCH OPERATION VALIDATION
    # ============================================================

    - name: Determine patch operation status
      ansible.builtin.set_fact:
        patch_operation_status: >-
          {{
            'PASS'
            if patch_activity_file.stat.exists
            and (package_count.stdout | trim | int) >= 0
            else 'FAIL'
          }}

    # ============================================================
    # 9. SNAPSHOT / BACKUP VALIDATION
    # ============================================================

    # Expected variables from the snapshot playbook:
    # snapshot_id
    # snapshot_state
    #
    # Example:
    # snapshot_id    : snap-0aceeea1a0444c5eb
    # snapshot_state : completed

    - name: Set snapshot information
      ansible.builtin.set_fact:
        compliance_snapshot_id: "{{ snapshot_id | default('NOT_AVAILABLE') }}"
        compliance_snapshot_state: "{{ snapshot_state | default('NOT_AVAILABLE') }}"

    - name: Determine snapshot status
      ansible.builtin.set_fact:
        snapshot_status: >-
          {{
            'PASS'
            if compliance_snapshot_state == 'completed'
            else 'FAIL'
          }}

    # ============================================================
    # 10. POST-PATCH VALIDATION
    # ============================================================

    - name: Determine post-check status
      ansible.builtin.set_fact:
        post_check_status: >-
          {{
            'PASS'
            if
              disk_status == 'PASS'
              and ssh_status == 'PASS'
              and server_reachable == 'PASS'
              and reboot_status == 'PASS'
            else 'FAIL'
          }}

    # ============================================================
    # 11. HEALTH CHECK
    # ============================================================

    - name: Determine overall health check
      ansible.builtin.set_fact:
        health_check_status: >-
          {{
            'PASS'
            if
              connectivity_status == 'PASS'
              and disk_status == 'PASS'
              and ssh_status == 'PASS'
              and server_reachable == 'PASS'
              and reboot_status == 'PASS'
            else 'FAIL'
          }}

    # ============================================================
    # 12. OVERALL COMPLIANCE
    # ============================================================

    - name: Determine overall compliance
      ansible.builtin.set_fact:
        compliance_status: >-
          {{
            'COMPLIANT'
            if
              patch_operation_status == 'PASS'
              and snapshot_status == 'PASS'
              and post_check_status == 'PASS'
              and health_check_status == 'PASS'
            else 'NON-COMPLIANT'
          }}

    # ============================================================
    # 13. RECORD REPORT END TIME
    # ============================================================

    - name: Record compliance report end time
      ansible.builtin.set_fact:
        compliance_report_end: "{{ lookup('pipe', 'date +%H:%M:%S') }}"

    # ============================================================
    # 14. DISPLAY COMPLIANCE REPORT
    # ============================================================

    - name: Display Linux Patch Compliance Report
      ansible.builtin.debug:
        msg:
          - "=============================================================="
          - "              LINUX PATCH COMPLIANCE REPORT"
          - "=============================================================="
          - ""
          - "SERVER INFORMATION"
          - "--------------------------------------------------------------"
          - "Server Name        : {{ hostname_result.stdout | trim }}"
          - "Server IP          : {{ ip_address.stdout | trim }}"
          - "Operating System   : {{ ubuntu_version.stdout | trim }}"
          - "Kernel             : {{ kernel_version.stdout | trim }}"
          - "Patch Date         : {{ ansible_date_time.date }}"
          - "Patch Start        : {{ compliance_report_start }}"
          - "Patch End          : {{ compliance_report_end }}"
          - ""
          - "--------------------------------------------------------------"
          - "BACKUP / SNAPSHOT"
          - "--------------------------------------------------------------"
          - "Snapshot ID        : {{ compliance_snapshot_id }}"
          - "Snapshot State     : {{ compliance_snapshot_state }}"
          - "Snapshot Status    : {{ snapshot_status }}"
          - ""
          - "--------------------------------------------------------------"
          - "PATCH ACTIVITY"
          - "--------------------------------------------------------------"
          - "Package                  Previous Version          New Version"
          - "--------------------------------------------------------------"
          - "{{ patch_activity_text }}"
          - ""
          - "Total Packages Changed : {{ package_count.stdout | trim }}"
          - ""
          - "--------------------------------------------------------------"
          - "POST-PATCH VALIDATION"
          - "--------------------------------------------------------------"
          - "Connectivity       : {{ connectivity_status }}"
          - "SSH Service        : {{ ssh_service.stdout | trim }}"
          - "Root Disk Free     : {{ disk_free_gb.stdout | trim }} GB"
          - "Minimum Required   : {{ minimum_disk_gb }} GB"
          - "Reboot Required    : {{ reboot_required.stat.exists }}"
          - "Server Reachable   : {{ server_reachable }}"
          - ""
          - "--------------------------------------------------------------"
          - "COMPLIANCE"
          - "--------------------------------------------------------------"
          - "Patch Operation    : {{ patch_operation_status }}"
          - "Snapshot           : {{ snapshot_status }}"
          - "Post Check         : {{ post_check_status }}"
          - "Health Check       : {{ health_check_status }}"
          - ""
          - "=============================================================="
          - "OVERALL COMPLIANCE : {{ compliance_status }}"
          - "=============================================================="

    # ============================================================
    # 15. FAIL JOB IF NON-COMPLIANT
    # ============================================================

    - name: Fail if server is non-compliant
      ansible.builtin.fail:
        msg: >-
          Linux patch compliance FAILED for
          {{ hostname_result.stdout | trim }}.
          Overall Compliance: {{ compliance_status }}
      when: compliance_status != 'COMPLIANT'

    # ============================================================
    # 16. SUCCESS MESSAGE
    # ============================================================

    - name: Compliance report completed successfully
      ansible.builtin.debug:
        msg:
          - "=============================================================="
          - "LINUX PATCH COMPLIANCE: COMPLIANT"
          - "=============================================================="
          - "Server              : {{ hostname_result.stdout | trim }}"
          - "Packages Changed    : {{ package_count.stdout | trim }}"
          - "Snapshot Status     : {{ snapshot_status }}"
          - "Post Check          : {{ post_check_status }}"
          - "Health Check        : {{ health_check_status }}"
          - "Patch validation completed successfully."
          - "=============================================================="
