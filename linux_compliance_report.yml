
---
- name: Generate Linux Patch Compliance Report
  hosts: Ubuntu-Server
  become: true
  gather_facts: true

  tasks:

    # ============================================================
    # 1. SERVER INFORMATION
    # ============================================================

    - name: Get server hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Get server IP address
      ansible.builtin.shell: |
        hostname -I | awk '{print $1}'
      register: ip_address
      changed_when: false

    - name: Get kernel version
      ansible.builtin.command: uname -r
      register: kernel_version
      changed_when: false

    - name: Get operating system
      ansible.builtin.command: lsb_release -ds
      register: ubuntu_version
      changed_when: false
      failed_when: false


    # ============================================================
    # 2. DISK VALIDATION
    # ============================================================

    - name: Check root filesystem
      ansible.builtin.command: df -h /
      register: disk_result
      changed_when: false

    - name: Check root filesystem free space in GB
      ansible.builtin.shell: |
        df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}'
      register: disk_free_gb
      changed_when: false

    - name: Set minimum required disk space
      ansible.builtin.set_fact:
        minimum_disk_gb: 1

    - name: Determine disk validation status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'PASS'
            if (disk_free_gb.stdout | trim | int) >= minimum_disk_gb
            else 'FAIL'
          }}


    # ============================================================
    # 3. CONNECTIVITY VALIDATION
    # ============================================================

    - name: Validate local connectivity
      ansible.builtin.command: ping -c 2 -W 2 8.8.8.8
      register: connectivity_check
      changed_when: false
      failed_when: false

    - name: Determine connectivity status
      ansible.builtin.set_fact:
        connectivity_status: >-
          {{
            'PASS'
            if connectivity_check.rc == 0
            else 'FAIL'
          }}


    # ============================================================
    # 4. SSH SERVICE VALIDATION
    # ============================================================

    - name: Check SSH service
      ansible.builtin.command: systemctl is-active ssh
      register: ssh_service
      changed_when: false
      failed_when: false

    - name: Determine SSH status
      ansible.builtin.set_fact:
        ssh_status: >-
          {{
            'PASS'
            if (ssh_service.stdout | trim) == 'active'
            else 'FAIL'
          }}


    # ============================================================
    # 5. REBOOT VALIDATION
    # ============================================================

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Determine reboot status
      ansible.builtin.set_fact:
        reboot_status: >-
          {{
            'PASS'
            if not reboot_required.stat.exists
            else 'FAIL'
          }}


    # ============================================================
    # 6. SERVER REACHABILITY
    # ============================================================

    - name: Validate Ansible connection
      ansible.builtin.command: echo "Server reachable"
      register: reachability_check
      changed_when: false
      failed_when: false

    - name: Determine server reachability
      ansible.builtin.set_fact:
        server_reachable: >-
          {{
            'PASS'
            if reachability_check.rc == 0
            else 'FAIL'
          }}


    # ============================================================
    # 7. CURRENT PATCH RUN
    # ============================================================

    - name: Check current patch activity file
      ansible.builtin.stat:
        path: /var/tmp/awx_patch_activity.txt
      register: current_patch_activity_stat

    - name: Read current patch activity
      ansible.builtin.slurp:
        src: /var/tmp/awx_patch_activity.txt
      register: current_patch_activity_raw
      when: current_patch_activity_stat.stat.exists

    - name: Set current patch activity content
      ansible.builtin.set_fact:
        current_patch_activity_content: >-
          {{
            current_patch_activity_raw.content | b64decode
            if current_patch_activity_stat.stat.exists
            else ''
          }}

    - name: Count current packages changed
      ansible.builtin.set_fact:
        current_packages_changed: >-
          {{
            current_patch_activity_content.splitlines()
            | reject('equalto', '')
            | list
            | length
          }}

    - name: Determine current patch activity status
      ansible.builtin.set_fact:
        current_patch_activity_status: >-
          {{
            'PASS'
            if current_patch_activity_stat.stat.exists
            else 'FAIL'
          }}


    # ============================================================
    # 8. LATEST SUCCESSFUL PATCH
    # ============================================================

    - name: Check latest successful patch activity
      ansible.builtin.stat:
        path: /var/tmp/awx_last_patch_activity.txt
      register: last_patch_activity_stat

    - name: Read latest successful patch activity
      ansible.builtin.slurp:
        src: /var/tmp/awx_last_patch_activity.txt
      register: last_patch_activity_raw
      when: last_patch_activity_stat.stat.exists

    - name: Set latest successful patch activity content
      ansible.builtin.set_fact:
        last_patch_activity_content: >-
          {{
            last_patch_activity_raw.content | b64decode
            if last_patch_activity_stat.stat.exists
            else ''
          }}

    - name: Count latest successful packages changed
      ansible.builtin.set_fact:
        last_packages_changed: >-
          {{
            last_patch_activity_content.splitlines()
            | reject('equalto', '')
            | list
            | length
          }}


    # ============================================================
    # 9. READ LATEST SUCCESSFUL PATCH METADATA
    # ============================================================

    - name: Check latest successful patch metadata
      ansible.builtin.stat:
        path: /var/tmp/awx_last_patch_metadata.txt
      register: last_patch_metadata_stat

    - name: Read latest successful patch metadata
      ansible.builtin.slurp:
        src: /var/tmp/awx_last_patch_metadata.txt
      register: last_patch_metadata_raw
      when: last_patch_metadata_stat.stat.exists

    - name: Set latest successful patch metadata
      ansible.builtin.set_fact:
        last_patch_metadata_content: >-
          {{
            last_patch_metadata_raw.content | b64decode
            if last_patch_metadata_stat.stat.exists
            else ''
          }}

    - name: Extract latest successful patch start time
      ansible.builtin.set_fact:
        last_patch_start_time: >-
          {{
            last_patch_metadata_content
            | regex_search('PATCH_START_TIME=(.*)', '\\1')
            | first
            | default('NOT_AVAILABLE')
          }}

    - name: Extract latest successful patch end time
      ansible.builtin.set_fact:
        last_patch_end_time: >-
          {{
            last_patch_metadata_content
            | regex_search('PATCH_END_TIME=(.*)', '\\1')
            | first
            | default('NOT_AVAILABLE')
          }}

    - name: Extract latest successful package count
      ansible.builtin.set_fact:
        last_patch_package_count: >-
          {{
            last_patch_metadata_content
            | regex_search('PACKAGES_CHANGED=(.*)', '\\1')
            | first
            | default(last_packages_changed | string)
          }}


    # ============================================================
    # 10. PATCH OPERATION VALIDATION
    # ============================================================

    - name: Determine patch operation status
      ansible.builtin.set_fact:
        patch_operation_status: >-
          {{
            'PASS'
            if current_patch_activity_status == 'PASS'
            else 'FAIL'
          }}


    # ============================================================
    # 11. SNAPSHOT / BACKUP VALIDATION
    # ============================================================

    - name: Set snapshot information
      ansible.builtin.set_fact:
        compliance_snapshot_id: "{{ snapshot_id | default('NOT_AVAILABLE') }}"
        compliance_snapshot_state: "{{ snapshot_state | default('NOT_AVAILABLE') }}"
        compliance_snapshot_status: "{{ snapshot_status | default('NOT_AVAILABLE') }}"

    - name: Determine snapshot status
      ansible.builtin.set_fact:
        final_snapshot_status: >-
          {{
            'PASS'
            if
              compliance_snapshot_state == 'completed'
              and compliance_snapshot_status == 'SUCCESS'
            else 'FAIL'
          }}


    # ============================================================
    # 12. POST-PATCH VALIDATION
    # ============================================================

    - name: Determine post-check status
      ansible.builtin.set_fact:
        post_check_status: >-
          {{
            'PASS'
            if
              disk_status == 'PASS'
              and ssh_status == 'PASS'
              and server_reachable == 'PASS'
              and reboot_status == 'PASS'
            else 'FAIL'
          }}


    # ============================================================
    # 13. HEALTH CHECK
    # ============================================================

    - name: Determine overall health check
      ansible.builtin.set_fact:
        health_check_status: >-
          {{
            'PASS'
            if
              connectivity_status == 'PASS'
              and disk_status == 'PASS'
              and ssh_status == 'PASS'
              and server_reachable == 'PASS'
              and reboot_status == 'PASS'
            else 'FAIL'
          }}


    # ============================================================
    # 14. OVERALL COMPLIANCE
    # ============================================================

    - name: Determine overall compliance
      ansible.builtin.set_fact:
        compliance_status: >-
          {{
            'COMPLIANT'
            if
              patch_operation_status == 'PASS'
              and final_snapshot_status == 'PASS'
              and post_check_status == 'PASS'
              and health_check_status == 'PASS'
            else 'NON-COMPLIANT'
          }}


    # ============================================================
    # 15. DISPLAY COMPLIANCE REPORT
    # ============================================================

    - name: Display Linux Patch Compliance Report
      ansible.builtin.debug:
        msg:
          - "=============================================================="
          - "              LINUX PATCH COMPLIANCE REPORT"
          - "=============================================================="
          - ""
          - "SERVER INFORMATION"
          - "--------------------------------------------------------------"
          - "Server Name        : {{ hostname_result.stdout | trim }}"
          - "Server IP          : {{ ip_address.stdout | trim }}"
          - "Operating System   : {{ ubuntu_version.stdout | trim }}"
          - "Kernel             : {{ kernel_version.stdout | trim }}"
          - ""
          - "--------------------------------------------------------------"
          - "CURRENT PATCH RUN"
          - "--------------------------------------------------------------"
          - "Patch Operation    : {{ patch_operation_status }}"
          - "Packages Changed   : {{ current_packages_changed }}"
          - ""
          - "Package                  Previous Version          New Version"
          - "--------------------------------------------------------------"
          - "{{ current_patch_activity_content | default('No package changes detected during this run.') }}"
          - ""
          - "--------------------------------------------------------------"
          - "LATEST SUCCESSFUL PATCH"
          - "--------------------------------------------------------------"
          - "Patch Start        : {{ last_patch_start_time }}"
          - "Patch End          : {{ last_patch_end_time }}"
          - "Packages Changed   : {{ last_patch_package_count }}"
          - ""
          - "Package                  Previous Version          New Version"
          - "--------------------------------------------------------------"
          - "{{ last_patch_activity_content | default('No previous successful patch activity available.') }}"
          - ""
          - "--------------------------------------------------------------"
          - "BACKUP / SNAPSHOT"
          - "--------------------------------------------------------------"
          - "Snapshot ID        : {{ compliance_snapshot_id }}"
          - "Snapshot State     : {{ compliance_snapshot_state }}"
          - "Snapshot Status    : {{ final_snapshot_status }}"
          - ""
          - "--------------------------------------------------------------"
          - "POST-PATCH VALIDATION"
          - "--------------------------------------------------------------"
          - "Connectivity       : {{ connectivity_status }}"
          - "SSH Service        : {{ ssh_service.stdout | trim }}"
          - "Root Disk Free     : {{ disk_free_gb.stdout | trim }} GB"
          - "Minimum Required   : {{ minimum_disk_gb }} GB"
          - "Reboot Required    : {{ reboot_required.stat.exists }}"
          - "Server Reachable   : {{ server_reachable }}"
          - ""
          - "--------------------------------------------------------------"
          - "COMPLIANCE"
          - "--------------------------------------------------------------"
          - "Patch Operation    : {{ patch_operation_status }}"
          - "Snapshot           : {{ final_snapshot_status }}"
          - "Post Check         : {{ post_check_status }}"
          - "Health Check       : {{ health_check_status }}"
          - ""
          - "=============================================================="
          - "OVERALL COMPLIANCE : {{ compliance_status }}"
          - "=============================================================="


    # ============================================================
    # 16. FAIL JOB IF NON-COMPLIANT
    # ============================================================

    - name: Fail if server is non-compliant
      ansible.builtin.fail:
        msg: >-
          Linux patch compliance FAILED for
          {{ hostname_result.stdout | trim }}.
          Overall Compliance: {{ compliance_status }}
      when: compliance_status != 'COMPLIANT'


    # ============================================================
    # 17. SUCCESS MESSAGE
    # ============================================================

    - name: Compliance report completed successfully
      ansible.builtin.debug:
        msg:
          - "=============================================================="
          - "LINUX PATCH COMPLIANCE: COMPLIANT"
          - "=============================================================="
          - "Server              : {{ hostname_result.stdout | trim }}"
          - "Current Packages    : {{ current_packages_changed }}"
          - "Last Successful     : {{ last_patch_package_count }}"
          - "Snapshot Status     : {{ final_snapshot_status }}"
          - "Post Check          : {{ post_check_status }}"
          - "Health Check        : {{ health_check_status }}"
          - "Patch validation completed successfully."
          - "=============================================================="
