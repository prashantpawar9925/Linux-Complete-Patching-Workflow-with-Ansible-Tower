---
- name: Ubuntu Server Pre-Patch Checks
  hosts: Ubuntu-Server
  become: true
  gather_facts: true

  tasks:

    - name: Test connectivity
      ansible.builtin.ping:

    - name: Get hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Check Ubuntu version
      ansible.builtin.command: lsb_release -ds
      register: ubuntu_version
      changed_when: false

    - name: Check root filesystem
      ansible.builtin.shell: |
        df -h /
      register: disk_result
      changed_when: false

    - name: Check root filesystem free space
      ansible.builtin.shell: |
        df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}'
      register: disk_free_gb
      changed_when: false

    - name: Fail if root filesystem has less than 1 GB free
      ansible.builtin.fail:
        msg: >-
          Pre-check failed.
          Root filesystem has only {{ disk_free_gb.stdout | trim }} GB free.
          Minimum required free space is 1 GB.
      when: (disk_free_gb.stdout | trim | int) < 1

    - name: Check uptime
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Check if reboot is already required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display pre-check results
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "LINUX PRE-PATCH CHECK"
          - "=========================================="
          - "Hostname: {{ hostname_result.stdout }}"
          - "Ubuntu: {{ ubuntu_version.stdout }}"
          - "Root Filesystem:"
          - "{{ disk_result.stdout }}"
          - "Free Space: {{ disk_free_gb.stdout | trim }} GB"
          - "Uptime: {{ uptime_result.stdout }}"
          - "Reboot Required: {{ reboot_required.stat.exists }}"
          - "=========================================="

    - name: Stop if reboot is already pending
      ansible.builtin.fail:
        msg: "Server already has a pending reboot. Resolve this before patching."
      when: reboot_required.stat.exists

    - name: Pre-check completed successfully
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "LINUX PRE-CHECK PASSED"
          - "Server is ready for patching."
          - "=========================================="
