
---
- name: Patch Ubuntu Server
  hosts: Ubuntu-Server
  become: true
  gather_facts: true

  tasks:

    # ============================================================
    # 1. RECORD PATCH START TIME
    # ============================================================

    - name: Record patch start time
      ansible.builtin.set_fact:
        patch_start_time: "{{ lookup('pipe', 'date +%H:%M:%S') }}"

    # ============================================================
    # 2. CAPTURE INSTALLED PACKAGE VERSIONS BEFORE PATCHING
    # ============================================================

    - name: Capture package versions before patching
      ansible.builtin.shell: |
        dpkg-query -W -f='${binary:Package}\t${Version}\n' | sort
      register: packages_before
      changed_when: false

    - name: Save package baseline
      ansible.builtin.copy:
        content: "{{ packages_before.stdout }}\n"
        dest: /var/tmp/awx_packages_before.txt
        mode: '0600'

    # ============================================================
    # 3. UPDATE APT REPOSITORY INFORMATION
    # ============================================================

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # ============================================================
    # 4. UPGRADE INSTALLED PACKAGES
    # ============================================================

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist
        state: present
      register: patch_result

    # ============================================================
    # 5. CAPTURE INSTALLED PACKAGE VERSIONS AFTER PATCHING
    # ============================================================

    - name: Capture installed package versions after patching
      ansible.builtin.shell: |
        dpkg-query -W -f='${binary:Package}\t${Version}\n' | sort
      register: packages_after
      changed_when: false

    - name: Save package state after patching
      ansible.builtin.copy:
        content: "{{ packages_after.stdout }}\n"
        dest: /var/tmp/awx_packages_after.txt
        mode: '0600'

    # ============================================================
    # 6. DETERMINE PACKAGE CHANGES
    # ============================================================

    - name: Generate patch activity report
      ansible.builtin.shell: |
        awk -F '\t' '
        NR==FNR {
          before[$1]=$2
          next
        }

        ($1 in before && before[$1] != $2) {
          print $1 "\t" before[$1] "\t" $2
        }

        !($1 in before) {
          print $1 "\tNOT_INSTALLED\t" $2
        }
        ' /var/tmp/awx_packages_before.txt \
          /var/tmp/awx_packages_after.txt \
          > /var/tmp/awx_patch_activity.txt
      changed_when: false

    # ============================================================
    # 7. COUNT PACKAGES CHANGED
    # ============================================================

    - name: Count packages changed
      ansible.builtin.shell: |
        if [ -s /var/tmp/awx_patch_activity.txt ]; then
          wc -l < /var/tmp/awx_patch_activity.txt
        else
          echo "0"
        fi
      register: package_count
      changed_when: false

    # ============================================================
    # 8. READ PATCH ACTIVITY
    # ============================================================

    - name: Read patch activity
      ansible.builtin.slurp:
        src: /var/tmp/awx_patch_activity.txt
      register: patch_activity_file

    - name: Display packages changed during this patch run
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "PATCH ACTIVITY - CURRENT AWX RUN"
          - "=================================================="
          - "Package                  Previous Version          New Version"
          - "--------------------------------------------------"
          - "{{ patch_activity_file.content | b64decode }}"
          - "--------------------------------------------------"
          - "Total Packages Changed: {{ package_count.stdout | trim }}"
          - "=================================================="

    # ============================================================
    # 8A. PRESERVE LAST SUCCESSFUL PATCH ACTIVITY
    # ============================================================

    - name: Preserve latest successful patch activity
      ansible.builtin.copy:
        src: /var/tmp/awx_patch_activity.txt
        dest: /var/tmp/awx_last_patch_activity.txt
        remote_src: true
        mode: '0600'
      when: (package_count.stdout | trim | int) > 0

    # ============================================================
    # 9. DETERMINE PATCH OPERATION STATUS
    # ============================================================

    - name: Determine patch operation status
      ansible.builtin.set_fact:
        patch_operation_status: >-
          {{
            'PASS'
            if patch_result.failed is not defined or not patch_result.failed
            else 'FAIL'
          }}

    # ============================================================
    # 10. CHECK IF REBOOT IS REQUIRED
    # ============================================================

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_before

    # ============================================================
    # 11. REBOOT UBUNTU SERVER IF REQUIRED
    # ============================================================

    - name: Reboot Ubuntu server if required
      ansible.builtin.reboot:
        reboot_timeout: 1800
        connect_timeout: 10
        test_command: uptime
      when: reboot_required_before.stat.exists
      register: reboot_result

    # ============================================================
    # 12. VERIFY REBOOT COMPLETED
    # ============================================================

    - name: Check reboot-required status after patching
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_after

    # ============================================================
    # 13. RECORD PATCH END TIME
    # ============================================================

    - name: Record patch end time
      ansible.builtin.set_fact:
        patch_end_time: "{{ lookup('pipe', 'date +%H:%M:%S') }}"

    # ============================================================
    # 13A. SAVE LAST SUCCESSFUL PATCH METADATA
    # ============================================================

    - name: Save latest successful patch metadata
      ansible.builtin.copy:
        content: |
          PATCH_START_TIME={{ patch_start_time }}
          PATCH_END_TIME={{ patch_end_time }}
          PACKAGES_CHANGED={{ package_count.stdout | trim }}
        dest: /var/tmp/awx_last_patch_metadata.txt
        mode: '0600'
      when:
        - (package_count.stdout | trim | int) > 0
        - patch_operation_status == 'PASS'
        - not reboot_required_after.stat.exists

    # ============================================================
    # 14. DISPLAY PATCH RESULT
    # ============================================================

    - name: Display patch result
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "UBUNTU PATCH RESULT"
          - "=================================================="
          - "Patch Start Time     : {{ patch_start_time }}"
          - "Patch End Time       : {{ patch_end_time }}"
          - "Packages Changed     : {{ package_count.stdout | trim }}"
          - "Patch Operation      : {{ patch_operation_status }}"
          - "Reboot Was Required  : {{ reboot_required_before.stat.exists }}"
          - "Reboot Pending       : {{ reboot_required_after.stat.exists }}"
          - "=================================================="

    # ============================================================
    # 15. PUBLISH PATCH INFORMATION TO AWX WORKFLOW
    # ============================================================

    - name: Publish patch information to AWX workflow
      ansible.builtin.set_stats:
        data:
          patch_start_time: "{{ patch_start_time }}"
          patch_end_time: "{{ patch_end_time }}"
          patch_operation_status: "{{ patch_operation_status }}"
          packages_changed: "{{ package_count.stdout | trim | int }}"
          reboot_was_required: "{{ reboot_required_before.stat.exists }}"
          reboot_pending: "{{ reboot_required_after.stat.exists }}"
          patch_activity: "{{ patch_activity_file.content | b64decode }}"
        aggregate: false

    # ============================================================
    # 16. FAIL IF PATCH OPERATION FAILED
    # ============================================================

    - name: Fail if patch operation failed
      ansible.builtin.fail:
        msg: "Ubuntu patch operation failed."
      when: patch_operation_status != 'PASS'

    # ============================================================
    # 17. FAIL IF REBOOT IS STILL REQUIRED
    # ============================================================

    - name: Fail if reboot is still pending
      ansible.builtin.fail:
        msg: >-
          Ubuntu server still requires a reboot after patching.
          Patch compliance cannot continue.
      when: reboot_required_after.stat.exists

    # ============================================================
    # 18. PATCH COMPLETED
    # ============================================================

    - name: Patch process completed successfully
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "UBUNTU PATCH COMPLETED"
          - "=================================================="
          - "Patch Operation    : PASS"
          - "Packages Changed   : {{ package_count.stdout | trim }}"
          - "Reboot Pending     : {{ reboot_required_after.stat.exists }}"
          - "Patch Start        : {{ patch_start_time }}"
          - "Patch End          : {{ patch_end_time }}"
          - "Server is ready for post-patch validation."
          - "=================================================="
